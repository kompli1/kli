  <style>
    :root {
      --text: #1d252d;
      --muted: #707579;
      --button: #54a9eb;
      --button-press: #429ce0;
      --link: #168acd;
      --border: rgba(255,255,255,.38);
      --card: rgba(255,255,255,.82);
      --shadow: 0 20px 40px rgba(63, 72, 52, .14), 0 2px 12px rgba(0,0,0,.08);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * { box-sizing: border-box; }
    html { min-height: 100%; -webkit-text-size-adjust: 100%; background: #ebe6d8; }
    body {
      margin: 0;
      min-height: 100svh;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow-x: hidden;
      background: transparent;
    }


    .tg-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 14% 10%, rgba(255,255,255,.42), transparent 26%),
        radial-gradient(circle at 82% 88%, rgba(107,133,99,.30), transparent 34%),
        radial-gradient(circle at 12% 78%, rgba(215,202,159,.32), transparent 30%),
        linear-gradient(135deg, #eee9d9 0%, #ece6d3 32%, #dfe5c9 66%, #b9c9a7 100%);
      transform: translateZ(0);
    }
    .tg-bg::before {
      content: "";
      position: absolute;
      inset: -40px;
      opacity: .32;
      background-image:
        linear-gradient(120deg, rgba(255,255,255,.32), rgba(255,255,255,0) 34%),
        radial-gradient(circle at 22% 26%, rgba(116,126,93,.16) 0 1px, transparent 1.4px),
        radial-gradient(circle at 74% 62%, rgba(255,255,255,.34) 0 1px, transparent 1.5px);
      background-size: 100% 100%, 18px 18px, 22px 22px;
      filter: blur(.1px);
    }
    .tg-bg::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to bottom, rgba(255,255,255,.18), rgba(255,255,255,.03) 34%, rgba(255,255,255,.13)),
        radial-gradient(circle at 50% 45%, rgba(255,255,255,.24), transparent 38%);
    }
    .bg-word {
      position: absolute;
      z-index: 1;
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 600;
      letter-spacing: .10em;
      line-height: 1;
      color: rgba(73, 83, 54, .32);
      text-transform: uppercase;
      white-space: nowrap;
      pointer-events: none;
      user-select: none;
      text-shadow: 0 1px 0 rgba(255,255,255,.46);
    }
    .bg-kv-1 { left: -48px; top: 58px; font-size: 138px; opacity: .30; transform: rotate(-9deg); }
    .bg-kv-2 { right: -38px; top: 360px; font-size: 118px; opacity: .24; transform: rotate(-8deg); }
    .bg-kv-3 { left: -24px; bottom: -18px; font-size: 88px; opacity: .22; transform: rotate(4deg); }
    .bg-store-1 { right: -34px; top: 114px; font-size: 27px; opacity: .38; transform: rotate(90deg); transform-origin: center; }
    .bg-store-2 { left: -78px; top: 270px; font-size: 27px; opacity: .34; transform: rotate(-90deg); transform-origin: center; }
    .bg-store-3 { left: 22px; bottom: 70px; font-size: 28px; opacity: .34; transform: rotate(-7deg); }
    .bg-store-4 { left: 112px; top: 72px; font-size: 24px; opacity: .32; transform: rotate(-11deg); }
    @media (min-width: 431px) {
      .bg-kv-1 { left: calc(50% - 285px); }
      .bg-kv-2 { right: calc(50% - 275px); }
      .bg-store-1 { right: calc(50% - 255px); }
      .bg-store-2 { left: calc(50% - 275px); }
      .bg-store-3 { left: calc(50% - 190px); }
      .bg-store-4 { left: calc(50% - 90px); }
    }


    .app { position: relative; z-index: 1; min-height: 100svh; display: flex; flex-direction: column; }
    .topbar {
      height: 48px;
      flex: 0 0 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,.48);
      border-bottom: 1px solid rgba(255,255,255,.30);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }
    .tg-brand { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: #202b36; font-size: 20px; font-weight: 700; letter-spacing: -.25px; }
    .tg-brand-icon { width: 31px; height: 31px; border-radius: 50%; display: grid; place-items: center; background: #54a9eb; color: #fff; box-shadow: 0 6px 14px rgba(84,169,235,.32); }
    .tg-brand-icon svg { width: 17px; height: 17px; display: block; }

    .wrap {
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
      padding: 16px 14px calc(20px + var(--safe-bottom));
      flex: 1;
      display: flex;
      align-items: center;
    }
    .card {
      width: 100%;
      margin: 0 auto;
      background: var(--card);
      border-radius: 22px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      padding: 22px 16px 16px;
      text-align: center;
    }

    .avatar-link { width: 104px; height: 104px; border-radius: 999px; overflow: hidden; display: inline-block; background: #000; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); -webkit-tap-highlight-color: transparent; }
    .avatar-link img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .title-row { margin-top: 13px; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .channel-title { font-size: 25px; line-height: 30px; font-weight: 600; letter-spacing: -.35px; }
    .verified { width: 19px; height: 19px; flex: 0 0 19px; display: block; object-fit: contain; transform: translateY(1px); }
    .subscribers { margin-top: 3px; color: var(--muted); font-size: 14px; line-height: 19px; }

    .action { margin: 18px auto 0; }
    .tg-button {
      position: relative;
      overflow: hidden;
      width: 100%;
      max-width: 330px;
      height: 52px;
      border-radius: 26px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #fff;
      background: var(--button);
      text-decoration: none;
      font-size: 17px;
      line-height: 52px;
      font-weight: 700;
      box-shadow: 0 10px 20px rgba(84,169,235,.28);
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .tg-button:active { transform: scale(.985); background: var(--button-press); }
    .tg-button svg { width: 20px; height: 20px; flex: 0 0 20px; }
    .tg-button::after { content: ""; position: absolute; top: 0; left: -60%; width: 48%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.38), transparent); transform: skewX(-22deg); animation: shine 3.5s ease-in-out infinite; }
    @keyframes shine { 0%, 48% { left: -60%; } 72%, 100% { left: 130%; } }

    .reviews { margin-top: 18px; text-align: left; }
    .reviews-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 2px 9px; }
    .reviews-title { display: flex; align-items: center; gap: 7px; font-size: 15px; line-height: 20px; font-weight: 700; }
    .reviews-title span { width: 20px; height: 20px; border-radius: 50%; display: inline-grid; place-items: center; color: #fff; background: var(--button); font-size: 12px; }
    .reviews-link { color: var(--link); font-size: 12px; line-height: 18px; text-decoration: none; white-space: nowrap; }
    .reviews-box { overflow: hidden; min-height: 143px; border: 1px solid rgba(255,255,255,.42); border-radius: 16px; background: rgba(248,250,251,.74); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
    .reviews-track { display: flex; transition: transform .42s ease; will-change: transform; }
    .review { min-width: 100%; padding: 14px 14px 12px; color: inherit; text-decoration: none; }
    .review-text { font-size: 14px; line-height: 20px; color: var(--text); max-height: 100px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; word-break: break-word; white-space: pre-line; }
    .review-image-wrap { width: 100%; height: 114px; border-radius: 12px; overflow: hidden; background: #eef2f5; margin-bottom: 8px; }
    .review-image { width: 100%; height: 100%; object-fit: cover; display: block; }
    .review-meta { margin-top: 8px; display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 12px; line-height: 16px; }
    .review-badge { color: var(--link); white-space: nowrap; }
    .dots { height: 17px; display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 8px; }
    .dot { width: 6px; height: 6px; border: 0; border-radius: 50%; background: rgba(112,117,121,.35); padding: 0; }
    .dot.active { background: var(--button); }
    .loading { min-width: 100%; padding: 22px 14px; color: var(--muted); text-align: center; font-size: 14px; line-height: 20px; }

    @media (max-width: 380px) {
      .wrap { padding-left: 12px; padding-right: 12px; }
      .card { padding: 20px 13px 14px; border-radius: 18px; }
      .avatar-link { width: 96px; height: 96px; }
      .channel-title { font-size: 24px; }
      .tg-button { height: 50px; font-size: 16px; }
      .reviews-box { min-height: 136px; }
      .review-text { font-size: 13.5px; line-height: 19.5px; }
    }
  </style>
</head>

        {"text":"Пришла моя посылка в город Ош за 2 дня. Костюм жилета и кроссовки, все отлично 👍🏻\nВсе пришло в том виде как и говорили, качество отличное, к телу очень приятный. Спасибо вам больше ❤️","meta":"Отзыв клиента (Ош • 2 дня)","link":"https://t.me/otziv_kavistore"},
        {"text":"Добрый день. Костюм пришел в Алмату за 2 дня. Все супер спасибо, доставили прямо на дом 🩷","meta":"Отзыв клиента (Алматы • 2 дня)","link":"https://t.me/otziv_kavistore"},
        {"text":"Камила, спасибо большое за джинсы ❤️\nВ Беларусь пришли очень быстро, я прям честно не ожидала что так быстро приедет. Качество отличное, материал также отличный. Буду обращаться к вам ещё 😘","meta":"Отзыв клиента (Беларусь • быстрая доставка)","link":"https://t.me/otziv_kavistore"},
        {"text":"Камила, добрый день. Получила костюм в Минске на Европочте, все пришло без проблем за 5 дней. Спасибо вам большое. Качество великолепно, уже стирала его — ничего не скатывается, все хорошо. Буду делать ещё заказы у вас спасибо","meta":"Отзыв клиента (Минск • 5 дней)","link":"https://t.me/otziv_kavistore"},
        {"text":"Бишкек шаарына болгону 3 күндө жетип келди, абдан тез. Куртка жылуу, жеңил жана үстүмдө абдан кооз көрүнөт. Өлчөмү да идеалдуу туура келди, кийүүгө абдан ыңгайлуу.","meta":"Отзыв клиента (Бишкек • 3 күн)","link":"https://t.me/otziv_kavistore"}
      ];
      var reviews = [];
      var current = 0;
      var timer = null;
      var startX = 0;

      function escapeHtml(value) {
        return String(value || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function safeUrl(value) {
        value = String(value || '').trim();
        if (!value) return '';
        if (value.indexOf('//') === 0) value = 'https:' + value;
        if (!/^https:\/\//i.test(value)) return '';
        return value.replace(/"/g, '%22').replace(/</g, '%3C').replace(/>/g, '%3E');
      }

      function normalize(items) {
        return (items || [])
          .filter(function (item) { return item && ((item.text && item.text.trim().length > 3) || item.image); })
          .slice(0, 20)
          .map(function (item) {
            return {
              text: item.text ? item.text.trim() : '',
              image: safeUrl(item.image || item.photo || ''),
              link: safeUrl(item.link || ''),
              meta: item.date || item.meta || 'Отзыв из Telegram'
            };
          });
      }

      function render(items) {
        reviews = normalize(items);
        if (!reviews.length) reviews = normalize(fallbackReviews);

        track.innerHTML = reviews.map(function (review) {
          var imageHtml = review.image ? '<div class="review-image-wrap"><img class="review-image" src="' + escapeHtml(review.image) + '" alt="Отзыв" loading="lazy" onerror="this.parentElement.remove()"></div>' : '';
          var textHtml = review.text ? '<div class="review-text">' + escapeHtml(review.text) + '</div>' : '';
          var open = review.link ? '<a class="review" href="' + escapeHtml(review.link) + '" target="_blank" rel="noopener">' : '<article class="review">';
          var close = review.link ? '</a>' : '</article>';
          return open + imageHtml + textHtml + '<div class="review-meta"><span>' + escapeHtml(review.meta) + '</span><span class="review-badge">Telegram</span></div>' + close;
        }).join('');

        dots.innerHTML = reviews.map(function (_, index) {
          return '<button class="dot' + (index === 0 ? ' active' : '') + '" type="button" data-index="' + index + '" aria-label="Отзыв ' + (index + 1) + '"></button>';
        }).join('');

        dots.querySelectorAll('.dot').forEach(function (dot) {
          dot.addEventListener('click', function () { goTo(Number(dot.getAttribute('data-index') || 0)); restart(); });
        });

        track.addEventListener('touchstart', function(e) { startX = e.touches[0].clientX; }, { passive: true });
        track.addEventListener('touchend', function(e) {
          var endX = e.changedTouches[0].clientX;
          var diff = endX - startX;
          if (Math.abs(diff) > 38) { goTo(current + (diff < 0 ? 1 : -1)); restart(); }
        }, { passive: true });

        goTo(0);
        restart();
      }

      function goTo(index) {
        if (!reviews.length) return;
        current = (index + reviews.length) % reviews.length;
        track.style.transform = 'translateX(-' + (current * 100) + '%)';
        dots.querySelectorAll('.dot').forEach(function (dot, i) { dot.classList.toggle('active', i === current); });
      }

      function restart() {
        if (timer) clearInterval(timer);
        if (reviews.length > 1) timer = setInterval(function () { goTo(current + 1); }, 3400);
      }

      fetch('reviews.json?v=' + Date.now(), { cache: 'no-store' })
        .then(function (res) { if (!res.ok) throw new Error('reviews.json'); return res.json(); })
        .then(function (data) { render(data && data.reviews ? data.reviews : fallbackReviews); })
        .catch(function () { render(fallbackReviews); });
    })();
  </script>
